    const { useState, useEffect, useRef } = React;

    // 1. MatrixGridCanvas: Interactive HTML5 Canvas Dot Grid with Spring Physics
    function MatrixGridCanvas() {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        if (!ctx) return;

        let animationFrameId;
        let width = (canvas.width = window.innerWidth);
        let height = (canvas.height = window.innerHeight);

        const mouse = {
          x: -1000,
          y: -1000,
          targetX: -1000,
          targetY: -1000,
          isHovering: false,
          radius: 170,
        };

        const SPACING = 34;
        let dots = [];

        const initDots = () => {
          dots = [];
          const cols = Math.ceil(width / SPACING) + 2;
          const rows = Math.ceil(height / SPACING) + 2;

          for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
              const x = c * SPACING;
              const y = r * SPACING;
              dots.push({
                originX: x,
                originY: y,
                x: x,
                y: y,
                vx: 0,
                vy: 0,
                baseRadius: 1.25,
                radius: 1.25,
                alpha: 0.16,
                baseAlpha: 0.16,
                color: '#10b981',
              });
            }
          }
        };

        const handleResize = () => {
          const dpr = window.devicePixelRatio || 1;
          width = window.innerWidth;
          height = window.innerHeight;
          canvas.width = width * dpr;
          canvas.height = height * dpr;
          canvas.style.width = width + 'px';
          canvas.style.height = height + 'px';
          ctx.scale(dpr, dpr);
          initDots();
        };

        handleResize();

        const onMouseMove = (e) => {
          const rect = canvas.getBoundingClientRect();
          mouse.targetX = e.clientX - rect.left;
          mouse.targetY = e.clientY - rect.top;
          mouse.isHovering = true;
        };

        const onMouseLeave = () => {
          mouse.targetX = -1000;
          mouse.targetY = -1000;
          mouse.isHovering = false;
        };

        const onTouchMove = (e) => {
          if (e.touches.length > 0) {
            const rect = canvas.getBoundingClientRect();
            mouse.targetX = e.touches[0].clientX - rect.left;
            mouse.targetY = e.touches[0].clientY - rect.top;
            mouse.isHovering = true;
          }
        };

        window.addEventListener('mousemove', onMouseMove);
        window.addEventListener('mouseleave', onMouseLeave);
        window.addEventListener('touchmove', onTouchMove, { passive: true });
        window.addEventListener('resize', handleResize);

        const render = (time) => {
          mouse.x += (mouse.targetX - mouse.x) * 0.15;
          mouse.y += (mouse.targetY - mouse.y) * 0.15;

          ctx.clearRect(0, 0, width, height);

          const spring = 0.075;
          const friction = 0.82;
          const t = time * 0.0016;
          const activeDots = [];

          for (let i = 0; i < dots.length; i++) {
            const dot = dots[i];
            const wave = Math.sin(dot.originX * 0.006 + dot.originY * 0.005 + t) * 3.5;
            const targetOriginY = dot.originY + wave;

            const dx = dot.x - mouse.x;
            const dy = dot.y - mouse.y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < mouse.radius && mouse.isHovering) {
              const force = (1 - dist / mouse.radius);
              const angle = Math.atan2(dy, dx);
              dot.vx += Math.cos(angle) * force * 5.2;
              dot.vy += Math.sin(angle) * force * 5.2;

              const targetAlpha = 0.25 + force * 0.75;
              dot.alpha += (targetAlpha - dot.alpha) * 0.2;
              dot.radius += (dot.baseRadius + force * 2.2 - dot.radius) * 0.2;
              dot.color = force > 0.65 ? '#a3e635' : '#10b981';

              if (force > 0.35) {
                activeDots.push(dot);
              }
            } else {
              dot.alpha += (dot.baseAlpha - dot.alpha) * 0.08;
              dot.radius += (dot.baseRadius - dot.radius) * 0.08;
              dot.color = '#10b981';
            }

            const ax = (dot.originX - dot.x) * spring;
            const ay = (targetOriginY - dot.y) * spring;

            dot.vx = (dot.vx + ax) * friction;
            dot.vy = (dot.vy + ay) * friction;

            dot.x += dot.vx;
            dot.y += dot.vy;

            ctx.beginPath();
            ctx.arc(dot.x, dot.y, Math.max(0.6, dot.radius), 0, Math.PI * 2);

            if (dot.alpha > 0.45) {
              ctx.fillStyle = dot.color;
              ctx.shadowColor = dot.color;
              ctx.shadowBlur = 10;
            } else {
              ctx.fillStyle = `rgba(16, 185, 129, ${dot.alpha})`;
              ctx.shadowBlur = 0;
            }
            ctx.fill();
          }

          // Dynamic connecting laser lines between excited dots
          if (activeDots.length > 1) {
            ctx.shadowBlur = 0;
            for (let j = 0; j < activeDots.length; j++) {
              for (let k = j + 1; k < activeDots.length; k++) {
                const p1 = activeDots[j];
                const p2 = activeDots[k];
                const segDist = Math.hypot(p1.x - p2.x, p1.y - p2.y);
                if (segDist < SPACING * 1.6) {
                  const lineAlpha = (1 - segDist / (SPACING * 1.6)) * 0.3;
                  ctx.beginPath();
                  ctx.moveTo(p1.x, p1.y);
                  ctx.lineTo(p2.x, p2.y);
                  ctx.strokeStyle = `rgba(16, 185, 129, ${lineAlpha})`;
                  ctx.lineWidth = 0.9;
                  ctx.stroke();
                }
              }
            }
          }

          animationFrameId = requestAnimationFrame(render);
        };

        animationFrameId = requestAnimationFrame(render);

        return () => {
          cancelAnimationFrame(animationFrameId);
          window.removeEventListener('mousemove', onMouseMove);
          window.removeEventListener('mouseleave', onMouseLeave);
          window.removeEventListener('touchmove', onTouchMove);
          window.removeEventListener('resize', handleResize);
        };
      }, []);

      return (
        <canvas
          ref={canvasRef}
          className="fixed inset-0 pointer-events-auto z-0"
          style={{ background: 'transparent' }}
          aria-hidden="true"
        />
      );
    }

    // 2. Navbar: Floating Frosted-Glass Navigation Bar
    function Navbar() {
      const [isScrolled, setIsScrolled] = useState(false);
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
      const [activeSection, setActiveSection] = useState('hero');

      useEffect(() => {
        const handleScroll = () => {
          setIsScrolled(window.scrollY > 20);
          const sections = ['projects', 'skills', 'campus', 'about', 'contact'];
          const scrollPosition = window.scrollY + 200;

          for (const section of sections) {
            const el = document.getElementById(section);
            if (el) {
              const top = el.offsetTop;
              const height = el.offsetHeight;
              if (scrollPosition >= top && scrollPosition < top + height) {
                setActiveSection(section);
                break;
              }
            }
          }
        };

        window.addEventListener('scroll', handleScroll);
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      const navLinks = [
        { name: 'Projects', href: '#projects', id: 'projects' },
        { name: 'Skills', href: '#skills', id: 'skills' },
        { name: 'Campus Journey', href: '#campus', id: 'campus' },
        { name: 'About', href: '#about', id: 'about' },
        { name: 'Contact', href: '#contact', id: 'contact' },
      ];

      const handleLinkClick = (e, href) => {
        e.preventDefault();
        setMobileMenuOpen(false);
        const target = document.querySelector(href);
        if (target) {
          target.scrollIntoView({ behavior: 'smooth' });
        }

                    <span>Chetan</span>
                    <span className="text-emerald-400 group-hover:text-lime-400 transition-colors">Surya</span>
                    <span className="text-xs text-emerald-500/80 font-mono font-normal hidden sm:inline">&lt;dev/&gt;</span>
                  </span>
                </div>
              </a>

              {/* Desktop Nav Links */}
              <div className="hidden md:flex items-center gap-1 lg:gap-2">
                {navLinks.map((link) => {
                  const isActive = activeSection === link.id;
                  return (
                    <a
                      key={link.name}
                      href={link.href}
                      onClick={(e) => handleLinkClick(e, link.href)}

                    >

                      )}
                    </a>
                  );
                })}
              </div>

              {/* Desktop Right CTA */}
              <div className="hidden md:flex items-center gap-3">
                <a
                  href="#contact"
                  onClick={(e) => handleLinkClick(e, '#contact')}
                  className="relative group overflow-hidden px-4 py-2 rounded-xl text-xs font-mono font-semibold text-emerald-300 bg-emerald-950/50 border border-emerald-500/30 hover:border-emerald-400 hover:text-white transition-all duration-300 shadow-sm hover:shadow-[0_0_18px_rgba(16,185,129,0.3)] cursor-pointer"

                    key={link.name}

                    <span>{link.name}</span>
                    <span className="text-emerald-500/60 font-mono text-xs">→</span>
                  </a>
                ))}
                <div className="pt-2 mt-1 border-t border-emerald-500/10">
                  <a
                    href="#contact"
                    onClick={(e) => handleLinkClick(e, '#contact')}
                    className="w-full block text-center py-2.5 rounded-xl font-mono text-xs font-semibold text-black bg-emerald-400 hover:bg-emerald-300 transition-colors shadow-[0_0_15px_rgba(16,185,129,0.4)]"
                  >
                    Open for Internships // Connect
                  </a>
                </div>
              </div>
            )}
          </nav>
        </header>
      );

    // 4. ProjectCard: 3D Perspective Tilt & Interactive Shine
    function ProjectCard({ project }) {
      const cardRef = useRef(null);
      const [transformStyle, setTransformStyle] = useState('perspective(1000px) rotateX(0deg) rotateY(0deg) translateY(0px)');
      const [shineStyle, setShineStyle] = useState({ opacity: 0 });
      const [isHovered, setIsHovered] = useState(false);

      const handleMouseMove = (e) => {
        if (!cardRef.current) return;
        const rect = cardRef.current.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const centerX = rect.width / 2;
        const centerY = rect.height / 2;

        const rotateX = ((y - centerY) / centerY) * -8;
        const rotateY = ((x - centerX) / centerX) * 8;

        setTransformStyle(
          `perspective(1000px) rotateX(${rotateX.toFixed(2)}deg) rotateY(${rotateY.toFixed(2)}deg) translateY(-6px)`
        );

        const shineX = (x / rect.width) * 100;
        const shineY = (y / rect.height) * 100;
        setShineStyle({
          opacity: 1,
          background: `radial-gradient(circle at ${shineX}% ${shineY}%, rgba(16, 185, 129, 0.22) 0%, rgba(163, 230, 53, 0.08) 35%, transparent 70%)`,
        });
      };

      const handleMouseEnter = () => setIsHovered(true);

      const handleMouseLeave = () => {
        setIsHovered(false);
        setTransformStyle('perspective(1000px) rotateX(0deg) rotateY(0deg) translateY(0px)');
        setShineStyle({ opacity: 0 });
      };

      return (
        <div
          ref={cardRef}
          onMouseMove={handleMouseMove}
          onMouseEnter={handleMouseEnter}
          onMouseLeave={handleMouseLeave}
          style={{
            transform: transformStyle,
            transition: isHovered
              ? 'transform 0.1s ease-out, box-shadow 0.3s ease, border-color 0.3s ease'
              : 'transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.5s ease, border-color 0.3s ease',
            transformStyle: 'preserve-3d',
          }}
          className={`relative rounded-2xl p-6 sm:p-7 flex flex-col justify-between overflow-hidden bg-[#0d1117]/85 backdrop-blur-xl border border-emerald-500/20 transition-all duration-300 ${
            isHovered
              ? 'border-emerald-500/50 shadow-[0_20px_45px_-10px_rgba(0,0,0,0.85),0_0_30px_rgba(16,185,129,0.25)]'
              : 'shadow-[0_8px_30px_rgba(0,0,0,0.6)]'
          }`}
        >
          {/* Shine Overlay */}
          <div
            className="absolute inset-0 pointer-events-none transition-opacity duration-300 rounded-2xl z-0"
            style={shineStyle}
            aria-hidden="true"
          />

          <div className="relative z-10 flex flex-col">

    const { useState, useEffect, useRef } = React;

    // 1. CursorSpark: Easter Egg Trailing Mouse Follower
    function CursorSpark() {
      const [visible, setVisible] = useState(false);
      const [isPointer, setIsPointer] = useState(false);
      const cursorRef = useRef(null);
      const auraRef = useRef(null);
      const pos = useRef({ x: -100, y: -100, targetX: -100, targetY: -100 });

      useEffect(() => {
        if (window.matchMedia('(pointer: coarse)').matches) return;

        const handleMouseMove = (e) => {
          pos.current.targetX = e.clientX;
          pos.current.targetY = e.clientY;
          if (!visible) setVisible(true);

          const target = e.target;
          if (
            target &&
            (target.tagName === 'BUTTON' ||
              target.tagName === 'A' ||
              target.closest('button') ||
              target.closest('a') ||
              target.tagName === 'INPUT' ||
              target.tagName === 'TEXTAREA')
          ) {
            setIsPointer(true);
          } else {
            setIsPointer(false);
          }
        };

        const handleMouseLeave = () => setVisible(false);

        window.addEventListener('mousemove', handleMouseMove);
        window.addEventListener('mouseleave', handleMouseLeave);

        let animationId;
        const updatePosition = () => {
          pos.current.x += (pos.current.targetX - pos.current.x) * 0.2;
          pos.current.y += (pos.current.targetY - pos.current.y) * 0.2;

          if (cursorRef.current && auraRef.current) {
            cursorRef.current.style.transform = `translate3d(${pos.current.targetX}px, ${pos.current.targetY}px, 0)`;
            auraRef.current.style.transform = `translate3d(${pos.current.x}px, ${pos.current.y}px, 0)`;
          }

          animationId = requestAnimationFrame(updatePosition);
        };

        animationId = requestAnimationFrame(updatePosition);

        return () => {
          window.removeEventListener('mousemove', handleMouseMove);
          window.removeEventListener('mouseleave', handleMouseLeave);
          cancelAnimationFrame(animationId);
        };
      }, [visible]);

      return (
        <div className={`pointer-events-none fixed inset-0 z-50 transition-opacity duration-300 ${visible ? 'opacity-100' : 'opacity-0'}`} aria-hidden="true">
          <div
            ref={auraRef}
            className={`fixed top-0 left-0 -ml-4 -mt-4 rounded-full pointer-events-none transition-all duration-150 ${
              isPointer
                ? 'w-10 h-10 -ml-5 -mt-5 bg-emerald-500/20 border border-lime-400/60 shadow-[0_0_20px_rgba(16,185,129,0.5)]'
                : 'w-8 h-8 bg-emerald-500/10 border border-emerald-400/30 shadow-[0_0_12px_rgba(16,185,129,0.3)]'
            } blur-[0.5px]`}
          />
          <div
            ref={cursorRef}
            className={`fixed top-0 left-0 -ml-1 -mt-1 rounded-full pointer-events-none transition-transform duration-75 ${
              isPointer ? 'w-2.5 h-2.5 -ml-1.25 -mt-1.25 bg-lime-300 shadow-[0_0_10px_#bef264]' : 'w-2 h-2 bg-emerald-400 shadow-[0_0_8px_#10b981]'
            }`}
          />
        </div>
      );
    }

    // 2. MatrixGridCanvas: Interactive HTML5 Canvas Dot Grid
    function MatrixGridCanvas() {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        if (!ctx) return;

        let animationFrameId;
        let width = (canvas.width = window.innerWidth);
        let height = (canvas.height = window.innerHeight);

        const mouse = {
          x: -1000,
          y: -1000,
          targetX: -1000,
          targetY: -1000,
          isHovering: false,
          radius: 170,
        };

        const SPACING = 34;
        let dots = [];

        const initDots = () => {
          dots = [];
          const cols = Math.ceil(width / SPACING) + 2;
          const rows = Math.ceil(height / SPACING) + 2;

          for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
              const x = c * SPACING;
              const y = r * SPACING;
              dots.push({
                originX: x,
                originY: y,
                x: x,
                y: y,
                vx: 0,
                vy: 0,
                baseRadius: 1.25,
                radius: 1.25,
                alpha: 0.16,
                baseAlpha: 0.16,
                color: '#10b981',
              });
            }
          }
        };

        const handleResize = () => {
          const dpr = window.devicePixelRatio || 1;
          width = window.innerWidth;
          height = window.innerHeight;
          canvas.width = width * dpr;
          canvas.height = height * dpr;
          canvas.style.width = width + 'px';
          canvas.style.height = height + 'px';
          ctx.scale(dpr, dpr);
          initDots();
        };

        handleResize();

        const onMouseMove = (e) => {
          const rect = canvas.getBoundingClientRect();
          mouse.targetX = e.clientX - rect.left;
          mouse.targetY = e.clientY - rect.top;
          mouse.isHovering = true;
        };

        const onMouseLeave = () => {
          mouse.targetX = -1000;
          mouse.targetY = -1000;
          mouse.isHovering = false;
        };

        const onTouchMove = (e) => {
          if (e.touches.length > 0) {
            const rect = canvas.getBoundingClientRect();
            mouse.targetX = e.touches[0].clientX - rect.left;
            mouse.targetY = e.touches[0].clientY - rect.top;
            mouse.isHovering = true;
          }
        };

        window.addEventListener('mousemove', onMouseMove);
        window.addEventListener('mouseleave', onMouseLeave);
        window.addEventListener('touchmove', onTouchMove, { passive: true });
        window.addEventListener('resize', handleResize);

        const render = (time) => {
          mouse.x += (mouse.targetX - mouse.x) * 0.15;
          mouse.y += (mouse.targetY - mouse.y) * 0.15;

          ctx.clearRect(0, 0, width, height);

          const spring = 0.075;
          const friction = 0.82;
          const t = time * 0.0016;
          const activeDots = [];

          for (let i = 0; i < dots.length; i++) {
            const dot = dots[i];
            const wave = Math.sin(dot.originX * 0.006 + dot.originY * 0.005 + t) * 3.5;
            const targetOriginY = dot.originY + wave;

            const dx = dot.x - mouse.x;
            const dy = dot.y - mouse.y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < mouse.radius && mouse.isHovering) {
              const force = (1 - dist / mouse.radius);
              const angle = Math.atan2(dy, dx);
              dot.vx += Math.cos(angle) * force * 5.2;
              dot.vy += Math.sin(angle) * force * 5.2;

              const targetAlpha = 0.25 + force * 0.75;
              dot.alpha += (targetAlpha - dot.alpha) * 0.2;
              dot.radius += (dot.baseRadius + force * 2.2 - dot.radius) * 0.2;
              dot.color = force > 0.65 ? '#a3e635' : '#10b981';

              if (force > 0.35) {
                activeDots.push(dot);
              }
            } else {
              dot.alpha += (dot.baseAlpha - dot.alpha) * 0.08;
              dot.radius += (dot.baseRadius - dot.radius) * 0.08;
              dot.color = '#10b981';
            }

            const ax = (dot.originX - dot.x) * spring;
            const ay = (targetOriginY - dot.y) * spring;

            dot.vx = (dot.vx + ax) * friction;
            dot.vy = (dot.vy + ay) * friction;

            dot.x += dot.vx;
            dot.y += dot.vy;

            ctx.beginPath();
            ctx.arc(dot.x, dot.y, Math.max(0.6, dot.radius), 0, Math.PI * 2);

            if (dot.alpha > 0.45) {
              ctx.fillStyle = dot.color;
              ctx.shadowColor = dot.color;
              ctx.shadowBlur = 10;
            } else {
              ctx.fillStyle = `rgba(16, 185, 129, ${dot.alpha})`;
              ctx.shadowBlur = 0;
            }
            ctx.fill();
          }

          // Dynamic connecting laser lines between excited dots
          if (activeDots.length > 1) {
            ctx.shadowBlur = 0;
            for (let j = 0; j < activeDots.length; j++) {
              for (let k = j + 1; k < activeDots.length; k++) {
                const p1 = activeDots[j];
                const p2 = activeDots[k];
                const segDist = Math.hypot(p1.x - p2.x, p1.y - p2.y);
                if (segDist < SPACING * 1.6) {
                  const lineAlpha = (1 - segDist / (SPACING * 1.6)) * 0.3;
                  ctx.beginPath();
                  ctx.moveTo(p1.x, p1.y);
                  ctx.lineTo(p2.x, p2.y);
                  ctx.strokeStyle = `rgba(16, 185, 129, ${lineAlpha})`;
                  ctx.lineWidth = 0.9;
                  ctx.stroke();
                }
              }
            }
          }

          animationFrameId = requestAnimationFrame(render);
        };

        animationFrameId = requestAnimationFrame(render);

        return () => {
          cancelAnimationFrame(animationFrameId);
          window.removeEventListener('mousemove', onMouseMove);
          window.removeEventListener('mouseleave', onMouseLeave);
          window.removeEventListener('touchmove', onTouchMove);
          window.removeEventListener('resize', handleResize);
        };
      }, []);

      return (
        <canvas
          ref={canvasRef}
          className="fixed inset-0 pointer-events-auto z-0"
          style={{ background: 'transparent' }}
          aria-hidden="true"
        />
      );
    }

    // 3. Navbar: Floating Frosted Glass

    // 5. ProjectCard: 3D Perspective Tilt
    function ProjectCard({ project }) {
      const cardRef = useRef(null);
      const [transformStyle, setTransformStyle] = useState('perspective(1000px) rotateX(0deg) rotateY(0deg) translateY(0px)');
      const [shineStyle, setShineStyle] = useState({ opacity: 0 });
      const [isHovered, setIsHovered] = useState(false);

      const handleMouseMove = (e) => {
        if (!cardRef.current) return;
        const rect = cardRef.current.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const centerX = rect.width / 2;
        const centerY = rect.height / 2;

        const rotateX = ((y - centerY) / centerY) * -8;
        const rotateY = ((x - centerX) / centerX) * 8;

        setTransformStyle(`perspective(1000px) rotateX(${rotateX.toFixed(2)}deg) rotateY(${rotateY.toFixed(2)}deg) translateY(-6px)`);

        const shineX = (x / rect.width) * 100;
        const shineY = (y / rect.height) * 100;
        setShineStyle({
          opacity: 1,
          background: `radial-gradient(circle at ${shineX}% ${shineY}%, rgba(16, 185, 129, 0.22) 0%, rgba(163, 230, 53, 0.08) 35%, transparent 70%)`,
        });
      };

      const handleMouseEnter = () => setIsHovered(true);
      const handleMouseLeave = () => {
        setIsHovered(false);
        setTransformStyle('perspective(1000px) rotateX(0deg) rotateY(0deg) translateY(0px)');
        setShineStyle({ opacity: 0 });
      };

      return (
        <div
          ref={cardRef}
          onMouseMove={handleMouseMove}
          onMouseEnter={handleMouseEnter}
          onMouseLeave={handleMouseLeave}
          style={{
            transform: transformStyle,
            transition: isHovered
              ? 'transform 0.1s ease-out, box-shadow 0.3s ease, border-color 0.3s ease'
              : 'transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.5s ease, border-color 0.3s ease',
            transformStyle: 'preserve-3d',
          }}
          className={`relative rounded-2xl p-6 sm:p-7 flex flex-col justify-between overflow-hidden bg-[#0d1117]/85 backdrop-blur-xl border border-emerald-500/20 transition-all duration-300 ${
            isHovered
              ? 'border-emerald-500/50 shadow-[0_20px_45px_-10px_rgba(0,0,0,0.85),0_0_30px_rgba(16,185,129,0.25)]'
              : 'shadow-[0_8px_30px_rgba(0,0,0,0.6)]'
          }`}
        >
          <div className="absolute inset-0 pointer-events-none transition-opacity duration-300 rounded-2xl z-0" style={shineStyle} aria-hidden="true" />
          <div className="relative z-10 flex flex-col">
            <div className="flex items-center justify-between mb-4">
              <span className="font-mono text-xs font-semibold px-2.5 py-1 rounded-md bg-emerald-950/60 border border-emerald-500/30 text-emerald-300 flex items-center gap-1.5">
                <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse" />
                {project.badge}
              </span>
              <span className="text-xs font-mono text-zinc-500">{project.serial}</span>
            </div>
            <h3 className="text-xl sm:text-2xl font-bold text-zinc-100 group-hover:text-emerald-300 transition-colors mb-3 tracking-tight">
              {project.title}
            </h3>
            <p className="text-zinc-300/90 text-sm sm:text-base leading-relaxed mb-6 font-normal">
              {project.description}
            </p>
            <div className="flex flex-wrap gap-2 mb-8">
              {project.tags.map((tag) => (
                <span key={tag} className="text-xs font-mono px-2.5 py-1 rounded-lg bg-carbon-800/80 border border-emerald-500/15 text-zinc-300">
                  #{tag}
                </span>
              ))}
            </div>
          </div>

          <div className="relative z-10 pt-4 border-t border-emerald-500/15 flex items-center gap-3">
            <a
              href={project.demoUrl}
              onClick={(e) => {
                e.preventDefault();

    // 9. MagneticLink Component
    function MagneticLink({ href, label, username, icon, external = true }) {
      const [offset, setOffset] = useState({ x: 0, y: 0 });
      const [isHovered, setIsHovered] = useState(false);

      const handleMouseMove = (e) => {
        const rect = e.currentTarget.getBoundingClientRect();
        const x = e.clientX - (rect.left + rect.width / 2);
        const y = e.clientY - (rect.top + rect.height / 2);
        setOffset({ x: x * 0.28, y: y * 0.28 });
      };

      const handleMouseEnter = () => setIsHovered(true);
      const handleMouseLeave = () => {
        setIsHovered(false);
        setOffset({ x: 0, y: 0 });
      };

      return (
        <a
          href={href}
          target={external ? '_blank' : '_self'}
          rel={external ? 'noopener noreferrer' : ''}
          onMouseMove={handleMouseMove}
          onMouseEnter={handleMouseEnter}
          onMouseLeave={handleMouseLeave}
          style={{
            transform: `translate3d(${offset.x}px, ${offset.y}px, 0)`,
            transition: isHovered ? 'transform 0.1s ease-out' : 'transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1)',
          }}
          className="group relative flex items-center gap-3.5 p-3.5 sm:p-4 rounded-2xl bg-carbon-800/60 hover:bg-emerald-950/40 border border-emerald-500/20 hover:border-emerald-400/60 shadow-[0_4px_20px_rgba(0,0,0,0.5)] hover:shadow-[0_0_25px_rgba(16,185,129,0.3)] transition-colors duration-200"
